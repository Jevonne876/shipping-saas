server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/shipping-saas
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Ensures Flyway is in control
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration


  jwt:
    secret-key: 
