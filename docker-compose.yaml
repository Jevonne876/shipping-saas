name: cargenixx-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: cargenixx-postgres
    restart: unless-stopped

    environment:
      # PostgreSQL administrator account
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}

      # Cargenixx application database
      CARGINEXX_DB_NAME: ${CARGINEXX_DB_NAME}
      CARGINEXX_DB_USER: ${CARGINEXX_DB_USER}
      CARGINEXX_DB_PASSWORD: ${CARGINEXX_DB_PASSWORD}

      # Keycloak database
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - cargenixx_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cargenixx-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: cargenixx-keycloak
    restart: unless-stopped

    command:
      - start-dev
      - --features=organization

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    ports:
      - "127.0.0.1:8081:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cargenixx-network

  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    container_name: cargenixx-seaweedfs
    restart: unless-stopped

    command:
      - mini
      - -dir=/data

    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}

    ports:
      # S3-compatible API
      - "127.0.0.1:8333:8333"

      # Master interface
      - "127.0.0.1:9333:9333"

      # Filer interface
      - "127.0.0.1:8888:8888"

      # Administration interface
      - "127.0.0.1:23646:23646"

    volumes:
      - cargenixx_seaweedfs_data:/data

    networks:
      - cargenixx-network

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.0
    container_name: cargenixx-elasticmq
    restart: unless-stopped

    ports:
      # SQS-compatible API
      - "127.0.0.1:9324:9324"

      # ElasticMQ web interface
      - "127.0.0.1:9325:9325"

    networks:
      - cargenixx-network

  mailpit:
    image: axllent/mailpit:v1.30.3
    container_name: cargenixx-mailpit
    restart: unless-stopped

    ports:
      # Local SMTP server
      - "127.0.0.1:1025:1025"

      # Email testing web interface
      - "127.0.0.1:8025:8025"

    networks:
      - cargenixx-network

networks:
  cargenixx-network:
    name: cargenixx-network
    driver: bridge

volumes:
  cargenixx_postgres_data:
    name: cargenixx-postgres-data

  cargenixx_seaweedfs_data:
    name: cargenixx-seaweedfs-data
